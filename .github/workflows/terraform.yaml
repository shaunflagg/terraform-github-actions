name: "Terraform Infrastructure Change Management Pipeline"

on:
  push:
    branches:
      - main
    paths:
      - terraform/**
  pull_request:
    branches:
      - main
    paths:
      - terraform/**

env:
  TF_LOG: INFO
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  terraform:
    name: "Terraform Infrastructure Change Management"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./terraform

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.11.0

      - name: Terraform Init
        id: init
        run: terraform init \
          -backend-config="bucket=sf-terraform-state-bucket" \
          -backend-config="key=terraform.tfstate" \
          -backend-config="region=us-east-1" \
          -backend-config="use_lockfile=true"

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request'
        run: |
          terraform plan -no-color -input=false | tee plan.out
        continue-on-error: true

      - name: Comment Plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/plan.out', 'utf8');
            const output = `#### Terraform Format 🖌: \`${{ steps.fmt.outcome }}\`
#### Init ⚙️: \`${{ steps.init.outcome }}\`
#### Validate ✅: \`${{ steps.validate.outcome }}\`
#### Plan 📖: \`${{ steps.plan.outcome }}\`

<details><summary>Show Plan</summary>

\`\`\`hcl
${plan}
\`\`\`

</details>

*Triggered by @${{ github.actor }} on \`${{ github.event_name }}\`.*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false
